name: Ana para Android (APK)

on:
  push:
    branches: [ccr-3d580dc9-qk67r1, main]
    paths: ['android/**', 'ana/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Baixar o modelo de voz offline (para ouvir "Ana" sem internet)
        run: |
          mkdir -p android/app/src/main/assets && cd android/app/src/main/assets
          curl -fsSL -o modelo.zip https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip
          unzip -q modelo.zip && rm modelo.zip
          mv vosk-model-small-pt-0.3 model-pt
          echo "pt-0.3-${GITHUB_RUN_NUMBER}" > model-pt/uuid

      - name: Gerar o APK
        run: cd android && gradle assembleRelease --no-daemon --stacktrace

      - name: Preparar arquivo
        run: cp android/app/build/outputs/apk/release/app-release.apk Ana.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Ana-apk
          path: Ana.apk

  teste:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Ana-apk
      - name: Ativar aceleração do emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Testar a Ana num Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none -no-snapshot
          script: bash android/selftest.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logcat
          path: |
            logcat.txt
            tela.png

  publicar:
    needs: teste
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Ana-apk
      - name: Publicar link de download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ana-latest
          name: Ana para Android
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Baixe o **Ana.apk** abaixo pelo celular Android e instale.
            Se o Android avisar sobre "fontes desconhecidas", permita a instalação para o seu navegador.
            Versão gerada automaticamente (build ${{ github.run_number }}).
          files: Ana.apk
